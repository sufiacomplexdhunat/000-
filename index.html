<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14532d"><meta name="description" content="সুফিয়া কমপ্লেক্স বাড়ি ভাড়া ব্যবস্থাপনা অ্যাপ">

<body>
<header><div><h1>🏠 সুফিয়া কমপ্লেক্স</h1><p>ধুনট, বগুড়া · ০১৩০৯-৪৯৩০৬৯</p></div><button id="installBtn" class="ghost" hidden>ইনস্টল</button></header>
<main>
<section id="login" class="panel login">
<h2>লগইন</h2>
<label>মোবাইল নম্বর<input id="loginPhone" inputmode="tel" placeholder="017xxxxxxxx" autocomplete="username"></label>
<label>পাসওয়ার্ড<input id="loginPass" type="password" placeholder="পাসওয়ার্ড" autocomplete="current-password"></label>
<button id="loginBtn">প্রবেশ করুন</button
</section>
<script src="app.js"></script>
